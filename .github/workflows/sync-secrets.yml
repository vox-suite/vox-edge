name: Sync Secrets from GSM to Railway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment containing secrets"
        required: true
        type: string
        default: "vox / production"
      secret_keys:
        description: "Comma-separated list of secret keys to sync (leave empty for defaults)"
        required: false
        type: string
        default: ""

jobs:
  sync-secrets:
    name: Sync GSM Secrets to Railway Shared Variables
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'vox / production' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Supports either Service Account Key (JSON) or Workload Identity Federation:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          # Uncomment below if using Workload Identity Federation instead of SA Key:
          # workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          # service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Secret Sync Script
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID || vars.RAILWAY_ENVIRONMENT_ID }}
          SECRET_KEYS: ${{ inputs.secret_keys }}
        run: |
          python3 scripts/sync-gsm-railway.py
